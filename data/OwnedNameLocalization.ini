; OwnedNameLocalization（归属名本地化）—— 配置
; 本文件可整份删除，删除即使用默认值。
; 位置：Data/SKSE/Plugins/OwnedNameLocalization.ini（与 dll 同目录；MO2 下即该 mod 目录）
; 文件名必须与 dll 同名。修改后需重启游戏。

[General]

; 目标语言的所有格标记（固定 3 字节 UTF-8）：
;   zh = 的        ja = の        ko = 의
; 拉丁文字语言（英/德/法…）本身用 's 或词尾 -s，不需要处理，故不提供。
Language=zh

; 可选：自定义所有格标记（必须正好 3 字节 UTF-8），填写后覆盖上面的 Language。
CustomAposReplacement=
