; SummonNameFix 配置文件
; 位置：Data/SKSE/Plugins/SummonNameFix.ini（与 dll 同目录）
; 所有键均可省略，省略时使用注释中的默认值。修改后需重启游戏。
;
; 跨版本说明：
;   本插件不依赖任何特定运行时（SE 1.5.97 / AE 1.6.x / VR 1.4.x）的静态地址。
;   通过运行时特征扫描（扫描已知英文原串、反解 lea 指令）动态定位格式串位置，
;   并在写入前做双重校验（lea 指向 + 原串字节匹配），任何一步失败即跳过。
;   → 上面两个字符串补丁完全不需要 Address Library。
;   → 只有下方可选的 GetDisplayFullName hook 需要 Address Library。
;
; 日志位置（与 skse64.log 同目录）：
;   文档\My Games\Skyrim Special Edition\SKSE\SummonNameFix.log
;   （GOG 版为 "Skyrim Special Edition GOG"，VR 版为 "Skyrim VR"）

[General]
; 总开关。false 时插件加载但不做任何修改。
Enable=true

; ---- 语言包 ----
; 选择目标语言。预设值：zh（中文）、ja（日文）、ko（韩文）、de（德语，不变）
; 自定义语言：见下方 CustomFmtReplacement / CustomAposReplacement
Language=zh

; 自定义格式化串替换（若填写，则覆盖 Language 预设）。
; 必须与原串等长（字节数相同），否则补丁会自动跳过。
; 示例：中文 = "%s\xE7\x9A\x84%s"  (7 字节)
CustomFmtReplacement=
; 自定义所有格串替换（同上）。示例：中文 = "\xE7\x9A\x84" (3 字节)
CustomAposReplacement=

; ---- 补丁开关 ----

; 召唤物/有主 Actor 路径：将引擎内 "%s's %s" 原位替换为语言包对应字符串。
; （例："本怡's 骷髅战士" -> "本怡的骷髅战士"）
PatchSummonPath=true

; 有主容器路径：将引擎内 "'s " 原位替换为语言包对应字符串。
; （例："Sven's Chest" -> "Sven的Chest"）
PatchContainerPath=true

; ---- 兜底 hook ----

; hook TESObjectREFR::GetDisplayFullName（Address Library ID 19354/19781），
; 对返回值含 "'s " 的名字做缓存化替换。
; 注意 1：需要安装 Address Library；缺失时本项会被自动跳过（日志里会写明）。
; 注意 2：上面的两个字符串补丁已覆盖主要路径，通常无需开启。
HookDisplayName=false

; 仅处理 Actor（FormType==ActorCharacter），避免误改物品名。
HookOnlyActors=true

; hook 缓存上限（以原始名字符串为键的条目数）。超限后自动降级为 thread_local 缓冲。
CacheLimit=4096

; 日志级别：trace/debug/info/warn/error/critical/off
LogLevel=info

; ---- 以下为调查模式，日常使用请保持关闭（有性能开销）----

; 记录 GetDisplayFullName 的返回值（字符串内容、十六进制字节、调用者返回地址、
; 线程 ID、是否 Actor），用于验证各界面取名路径。需要 HookDisplayName 或本项开启。
LogNameCalls=false

; 调查日志最多记录条数（防止刷爆日志文件）。
LogCallsLimit=200
