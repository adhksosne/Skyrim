; SummonNameFix —— 配置（本文件可整份删除，删除即使用默认值）
; 位置：Data/SKSE/Plugins/SummonNameFix.ini（与 dll 同目录；MO2 下即该 mod 目录）
; 修改后需重启游戏。

[General]

; 目标语言的所有格标记（固定 3 字节 UTF-8）：
;   zh = 的        ja = の        ko = 의        de = 's（保持英文，仅作对照）
Language=zh

; 可选：自定义所有格标记（必须正好 3 字节 UTF-8），填写后覆盖上面的 Language。
; 例：俄语可填 ……（须为 3 字节，否则会被忽略并记录日志）
CustomAposReplacement=
