; SummonNameFixCN 配置文件
; 位置：Data/SKSE/Plugins/SummonNameFixCN.ini（与 dll 同目录）
; 所有键均可省略，省略时使用注释中的默认值。修改后需重启游戏。

[General]
; 总开关。false 时插件加载但不做任何修改。
Enable=true

; 召唤物/有主 Actor 路径：将 TESNPC 名字组装器的格式串 "%s's %s" 原位替换为 "%s的%s"。
; （例："本怡's 骷髅战士" -> "本怡的骷髅战士"）
PatchSummonPath=true

; 有主容器路径：将 TESObjectCONT 名字组装器的 "'s " 原位替换为 "的"。
; （例："Sven's Chest" -> "Sven的Chest"）
PatchContainerPath=true

; 兜底 hook（默认关闭）。
; hook TESObjectREFR::GetDisplayFullName，对返回结果中含 "'s " 的名字做缓存化替换。
; 注意：上面的两个字符串补丁已覆盖主要路径（召唤物 / 有主容器），通常无需开启本项。
; 插件安装前会校验函数头；若 GetDisplayFullName 已被其它插件（如 Lexicon）先行 hook
; 或版本不符，则只记录日志并跳过，不会修改任何指令。
HookDisplayName=false

; 兜底 hook 是否仅处理 Actor（FormType==ActorCharacter）。true 可避免误改物品名。
HookOnlyActors=true

; 兜底 hook 缓存上限（以原始名字符串为键的条目数）。超限后自动降级为
; thread_local 缓冲（仍线程安全，只是不再常驻缓存）。
CacheLimit=4096

; 日志级别：trace/debug/info/warn/error/critical/off
LogLevel=info

; ---- 以下为调查模式，日常使用请保持关闭（有性能开销）----

; 记录 GetDisplayFullName 的返回值（字符串内容、十六进制字节、调用者返回地址、
; 线程 ID、是否 Actor），用于验证各界面取名路径。需要 HookDisplayName 或本项开启。
LogNameCalls=false

; 调查日志最多记录条数（防止刷爆日志文件）。
LogCallsLimit=200
