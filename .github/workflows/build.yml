name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_bincache
    steps:
      # 子模块里带有超长路径（openvr 的 .dSYM 目录），Windows 上需先开启长路径
      - name: Enable git long paths
        run: git config --global core.longpaths true

      # CommonLibSSE（Zzyxz 修复分支）以子模块形式内置，必须带上 --recursive
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 依赖（spdlog / rapidcsv）的 vcpkg 二进制缓存
      - name: Create vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force vcpkg_bincache | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bincache-x64-windows-static-

      # 注意：这里刻意【不再】缓存 CMake 构建树。
      # 之前为了提速缓存过 build/ 并刷新过产物时间戳，结果 MSBuild 认为 main.cpp 无需重编，
      # 连续多次 CI 都链接了缓存里的旧 main.cpp.obj —— 产出的 DLL 一直是旧代码（严重错误）。
      # 现在每次都全新构建，保证 DLL 与源码一致；后续若要提速将改用内容哈希的编译器缓存(sccache)。

      # 依赖只有 spdlog / rapidcsv，全部来自 vcpkg 官方仓库（无私有 registry、无陈旧 baseline）。
      # 直接用 runner 预装的 vcpkg，避免 VS 自带 vcpkg 的行为差异与旧端口兼容问题。
      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          Write-Host "vcpkg root: $vcpkgRoot"
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DSKYRIM_VARIANT=UNIVERSAL `
            -DPLUGIN_BUILD_ID="${{ github.sha }}" *>&1 | Tee-Object -FilePath configure.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $raw = Get-Content configure.log -Raw
            if ([string]::IsNullOrEmpty($raw)) { $raw = '(no output)' }
            if ($raw.Length -gt 2000) { $raw = $raw.Substring($raw.Length - 2000) }
            Write-Host ("::error title=CMake configure failed::" + ($raw -replace "`r?`n", "%0A"))
            exit 1
          }

      - name: Build
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: |
          # --parallel：MSBuild 走多核并行（默认可能单进程），对 500+ 文件的大库影响很大
          cmake --build build --config Release --parallel *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $raw = Get-Content build.log -Raw
            if ($raw.Length -gt 3000) { $raw = $raw.Substring($raw.Length - 3000) }
            Write-Host ("::error title=CMake build failed::" + ($raw -replace "`r?`n", "%0A"))
            exit 1
          }

      # 防止再次产出“旧二进制”：DLL 里必须含有本次提交的指纹（由 PLUGIN_BUILD_ID 注入）。
      # 若链接到了缓存/旧的目标文件，这里会直接让 CI 失败，而不是把旧 DLL 发出去。
      - name: Verify built DLL carries this commit id
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $dll = Get-ChildItem -Recurse -Path build -Filter "PossessiveLocalization.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "构建产物 PossessiveLocalization.dll 未找到"; exit 1 }
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          if (-not $text.Contains($sha)) {
            Write-Host "::error title=stale binary::生成的 DLL 不含本次提交指纹 $sha，说明链接了旧目标文件"
            exit 1
          }
          Write-Host "指纹校验通过：$($dll.FullName) 含 build=$sha"

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "PossessiveLocalization.dll" |
            Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Path build -Filter "PossessiveLocalization.dll" | Select-Object -First 1
          }
          if (-not $dll) { Write-Error "构建产物 PossessiveLocalization.dll 未找到"; exit 1 }
          Copy-Item $dll.FullName dist/
          Copy-Item data/PossessiveLocalization.ini dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # 单个 DLL 同时支持 SE / AE / VR，无需按版本分开构建
          name: PossessiveLocalization
          path: dist/
          if-no-files-found: error
