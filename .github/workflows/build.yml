name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # 只构建 release 变体，跳过用不到的 debug，时间约减半
      VCPKG_BUILD_TYPE: release
      # vcpkg 二进制缓存目录（由 actions/cache 持久化，命中后依赖秒装）
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_bincache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force vcpkg_bincache | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_bincache
          # key 带 v2 前缀：避开旧版 workflow（VCPKG_BINARY_SOURCES=clear，未写入任何内容）
          # 可能已用同 key 存下的空缓存，否则会永远命中空缓存、无法重建。
          key: vcpkg-bincache-v2-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-bincache-v2-x64-windows-static-md-

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # 与 vcpkg.json 的 builtin-baseline 保持一致的稳定基线
          vcpkgGitCommitId: fc3f61366102c1f0d4547c06d03c523bb18c13a7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release, Ninja, vcpkg manifest)
        env:
          # 关键：run-vcpkg 会在 job 级写入 VCPKG_BINARY_SOURCES=clear;x-gha,readwrite，
          # 但新版 runner 不再注入 ACTIONS_RUNTIME_TOKEN，x-gha 源会直接报错；
          # 而单独写 clear 又会把 vcpkg 默认的 files 缓存源也清掉，导致编译好的依赖
          # 从不落盘、每次 CI 全量重编（这就是之前每次 20 分钟的根因）。
          # 正解：显式指定 files 缓存源指向 workspace 目录，由 actions/cache 持久化。
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: cmake --build build

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "SummonNameFixCN.dll" |
            Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Path build -Filter "SummonNameFixCN.dll" | Select-Object -First 1
          }
          if (-not $dll) { Write-Error "构建产物 SummonNameFixCN.dll 未找到"; exit 1 }
          Copy-Item $dll.FullName dist/
          Copy-Item data/SummonNameFixCN.ini dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SummonNameFixCN-SE197
          path: dist/
          if-no-files-found: error
