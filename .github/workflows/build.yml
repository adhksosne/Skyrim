name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      # 依赖全部由 CMake FetchContent 直接从上游 tag 拉取（见 CMakeLists.txt），
      # 不再需要 vcpkg / registry / baseline，也不受 runner 镜像里旧端口的影响。
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release *>&1 | Tee-Object -FilePath configure.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $raw = Get-Content configure.log -Raw
            if ([string]::IsNullOrEmpty($raw)) { $raw = '(no output)' }
            if ($raw.Length -gt 2000) { $raw = $raw.Substring($raw.Length - 2000) }
            Write-Host ("::error title=CMake configure failed::" + ($raw -replace "`r?`n", "%0A"))
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $raw = Get-Content build.log -Raw
            if ($raw.Length -gt 2000) { $raw = $raw.Substring($raw.Length - 2000) }
            Write-Host ("::error title=CMake build failed::" + ($raw -replace "`r?`n", "%0A"))
            exit 1
          }

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "SummonNameFix.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "构建产物 SummonNameFix.dll 未找到"; exit 1 }
          Copy-Item $dll.FullName dist/
          Copy-Item data/SummonNameFixCN.ini dist/SummonNameFix.ini

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # CommonLibSSE-NG 的产物是单个 DLL，同时支持 SE / AE / VR，无需按版本分开构建
          name: SummonNameFix
          path: dist/
          if-no-files-found: error
