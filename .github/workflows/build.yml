name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [se, ae, vr]
        include:
          - runtime: se
            desc: "SE 1.5.x"
            tag: "SE"
          - runtime: ae
            desc: "AE 1.6.x"
            tag: "AE"
          - runtime: vr
            desc: "VR 1.4.x"
            tag: "VR"
    env:
      VCPKG_BUILD_TYPE: release
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_bincache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force vcpkg_bincache | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-v2-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-bincache-v2-x64-windows-static-md-

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: fc3f61366102c1f0d4547c06d03c523bb18c13a7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release, Ninja, vcpkg manifest)
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: cmake --build build

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = Get-ChildItem -Recurse -Path build -Filter "SummonNameFix.dll" |
            Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Path build -Filter "SummonNameFix.dll" | Select-Object -First 1
          }
          if (-not $dll) { Write-Error "构建产物 SummonNameFix.dll 未找到"; exit 1 }
          Copy-Item $dll.FullName dist/
          Copy-Item data/SummonNameFix.ini dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SummonNameFix-${{ matrix.tag }}
          path: dist/
          if-no-files-found: error
